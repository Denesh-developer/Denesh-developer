<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">DENESHRAJA N — Cyber Systems</title>
<desc id="desc">Original animated cyberpunk developer banner with a neon cyan grid, scanning beam, orbiting nodes and glitch typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080D"/><stop offset=".55" stop-color="#0A1420"/><stop offset="1" stop-color="#10091B"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00F5FF"/><stop offset=".5" stop-color="#387BFF"/><stop offset="1" stop-color="#B84DFF"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#00F5FF" stop-opacity="0"/><stop offset=".5" stop-color="#00F5FF" stop-opacity=".8"/><stop offset="1" stop-color="#00F5FF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#1B4960" stroke-opacity=".36" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="18" y="18" width="1164" height="354" rx="18"/></clipPath>
</defs>
<rect width="1200" height="390" rx="22" fill="#05080D"/>
<g clip-path="url(#clip)">
