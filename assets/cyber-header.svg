    <circle cx="185" cy="95" r="4" fill="#00F5FF"/><circle cx="1015" cy="95" r="4" fill="#00F5FF"/>
    <circle cx="185" cy="295" r="4" fill="#00F5FF"/><circle cx="1015" cy="295" r="4" fill="#00F5FF"/>
  </g>
